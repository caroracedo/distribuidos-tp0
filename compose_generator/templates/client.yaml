  client{cli_id}:
    container_name: client{cli_id}
    image: client:latest
    entrypoint: /client
    environment:
      - CLI_ID={cli_id}
      - DATA_FILE=/data/agency.csv
    networks:
      - testing_net
    depends_on:
      - server
    volumes:
      - ./client/config.yaml:/config.yaml
      - ./.data/agency-{cli_id}.csv:/data/agency.csv
